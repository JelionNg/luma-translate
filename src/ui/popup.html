<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="./ui.css"><body class="popup"><header><strong><img class="brand-icon" src="../../icons/32.png" alt="">Luma Translate</strong><small>0.22.0</small></header><label>翻译服务<select id="service"></select></label><label>目标语言<select id="targetLang"><option>简体中文</option><option>繁體中文</option><option>English</option><option>日本語</option><option>한국어</option><option>Français</option><option>Deutsch</option><option>Español</option></select></label><label>阅读模式<select id="mode"><option value="dual">原文 + 译文</option><option value="translation">仅显示译文</option></select></label><div class="preferences"><label class="row">打开网页自动翻译<input type="checkbox" id="autoTranslate"></label><label class="row">翻译动态新增内容<input type="checkbox" id="dynamic"></label><label class="row">翻译页面内的嵌入内容<input type="checkbox" id="translateFrames" aria-describedby="framesHelp"></label><small id="framesHelp" class="option-help">例如嵌入的文章或评论区。普通正文无需开启；这类区域漏译时可尝试开启。</small></div><button id="go">开始翻译 · Alt+A</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status">就绪</p><div class="row"><button class="secondary" id="clear">恢复原文</button><button class="secondary" id="settings">接口设置</button></div><button class="secondary" id="selection">划词翻译 · Alt+T</button><button class="secondary" id="videoTranslate">视频字幕翻译</button><button class="secondary" id="imageOcr">图片识别与翻译</button><button class="secondary" id="diagnose">段落诊断</button><script src="../shared/reader-config.js"></script><script src="./popup.js"></script></body></html>
