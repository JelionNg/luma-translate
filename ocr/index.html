<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地图片识别 · Luma Translate</title><link rel="stylesheet" href="ocr.css"><body><main><header><div><span class="eyebrow">ON-DEVICE · PP-OCRv6 SMALL</span><h1>图片里的文字，在本机读取。</h1><p>图片识别由浏览器本地运行。模型按需加载，关闭页面即释放。</p></div><label class="choose">选择图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></header><div class="toolbar"><span id="status" role="status">选择一张图片开始 · 支持 PNG、JPEG、WebP、GIF</span><button id="cancel" disabled>取消并释放模型</button><button id="again" disabled>再次识别</button><button id="copy" disabled>复制文字</button><button id="translate" disabled>翻译识别文字</button></div><section class="workspace"><div class="preview"><canvas id="canvas"></canvas><p id="empty">截图、海报、文章图片</p></div><aside><h2>识别结果</h2><p class="hint">识别在本机完成；点击翻译后，仅文字发送到已配置的翻译服务。</p><p id="metrics"></p><div id="results"></div></aside></section><details><summary>本地运行信息</summary><pre id="details">检测与识别均在独立 Worker 中执行；单线程 WASM，不调用云端 OCR。</pre></details></main><script src="../src/image/image-layout.js"></script><script type="module" src="ocr-page.js"></script></body></html>
