<!doctype html><meta charset="utf-8"><title>翻译设置</title><link rel="stylesheet" href="ui.css"><body class="settings"><header><h1><img class="brand-icon" src="icons/48.png" alt="">翻译设置</h1></header><p class="subtitle">为双语阅读配置你的翻译服务</p><label>已保存服务<select id="service"></select></label><div class="row"><button class="secondary" id="newService">新增服务</button><button class="secondary" id="deleteService">删除此服务</button></div><label>服务名称<input id="serviceName" maxlength="80"></label><label>接口地址<input id="endpoint"></label><label>API Key<input id="apiKey" type="password"></label><label>模型<input id="model"></label><label>服务并发上限（1–6）<input id="concurrency" type="number" min="1" max="6"></label><label>请求间隔（毫秒，0–60000）<input id="minInterval" type="number" min="0" max="60000"></label><label>目标语言<select id="targetLang"><option>简体中文</option><option>繁體中文</option><option>English</option><option>日本語</option><option>한국어</option><option>Français</option><option>Deutsch</option><option>Español</option></select></label><label>术语表（每行：原词 = 译法，最多 50 条）<textarea id="glossary" rows="6" placeholder="OpenAI = OpenAI&#10;large language model = 大语言模型"></textarea></label><label>译文字号<select id="translationSize"><option value="0.9">紧凑 · 90%</option><option value="1">跟随原文 · 100%</option><option value="1.1">舒适 · 110%</option></select></label><label>段落间距<select id="translationSpacing"><option value="0.2">紧凑</option><option value="0.4">标准</option><option value="0.7">宽松</option></select></label><label>译文颜色<select id="translationTone"><option value="inherit">跟随网页（适配深色页面）</option><option value="violet">柔紫色</option></select></label><button id="save">保存</button><span id="msg"></span><button class="secondary" id="clearCache">清空翻译缓存</button><hr><h2>站点规则</h2><p>按域名保存正文、排除选择器与图片适配；path 为 * 表示全站，其他值精确匹配页面路径。禁用内置适配设 disabled 为 true。</p><label>规则 JSON<textarea id="rulesJson" rows="12" spellcheck="false"></textarea></label><div class="row"><button id="saveRules">保存规则</button><button class="secondary" id="exportRules">导出规则</button></div><label>导入规则（合并域名）<input id="importRules" type="file" accept="application/json,.json"></label><span id="ruleMsg" role="status"></span><script src="reader-config.js"></script><script src="image-rules.js"></script><script src="user-rules.js"></script><script src="options.js"></script>
